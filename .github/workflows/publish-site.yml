name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_projects:
        description: Import the latest Projects and ProjectImages tabs before publishing
        type: boolean
        default: true
      allow_empty_projects:
        description: Deliberately replace the Studio portfolio with no published projects
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artprime-website
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh Studio from Google Sheets
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_projects
        env:
          ALLOW_EMPTY_PROJECTS: ${{ inputs.allow_empty_projects }}
        run: |
          if [ "$ALLOW_EMPTY_PROJECTS" = "true" ]; then
            npm run sync:studio -- --allow-empty
          else
            npm run sync:studio
          fi
      - run: npm test
      - run: npm run build:site
      - name: Save the validated portfolio snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_projects
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/studio-projects.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Studio portfolio from Google Sheets"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
